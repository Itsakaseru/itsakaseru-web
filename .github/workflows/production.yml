name: Deploy Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://itsaksaeru.me

    env:
      # Registry information
      REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
      REGISTRY_REPOSITORY: ${{ secrets.REGISTRY_REPOSITORY }}

      # Astro build environment
      SITE_URL: "https://itsaksaeru.me"

      # Railpack build environment
      RAILPACK_VERSION: "0.38.0"
      RAILPACK_DEPLOY_APT_PACKAGES: "curl"

      # Dokploy deployment check
      DOKPLOY_DEPLOY_TIMEOUT: "300"
      DOKPLOY_DEPLOY_POLL_INTERVAL: "5"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:github-action
          ping: ${{ secrets.TS_HOST }}

      - name: Login to container registry
        env:
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail

          echo "${REGISTRY_PASSWORD}" | docker login "${REGISTRY_HOST}" \
            --username "${REGISTRY_USERNAME}" \
            --password-stdin

      - name: Install Railpack
        run: |
          set -euo pipefail

          mkdir -p "${HOME}/.local/bin"

          curl -fsSL https://railpack.com/install.sh | \
            RAILPACK_VERSION="${RAILPACK_VERSION}" \
            bash -s -- --bin-dir "${HOME}/.local/bin"

          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

          "${HOME}/.local/bin/railpack" --version

      - name: Start BuildKit
        run: |
          set -euo pipefail

          docker run \
            --rm \
            --privileged \
            --detach \
            --name buildkit \
            moby/buildkit

          echo "BUILDKIT_HOST=docker-container://buildkit" >> "${GITHUB_ENV}"

      - name: Pull contents from S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.S3_REGION }}
          S3_ENDPOINT_URL: ${{ secrets.S3_ENDPOINT_URL }}
        run: |
          set -euo pipefail

          : "${AWS_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID is not configured}"
          : "${AWS_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY is not configured}"
          : "${AWS_DEFAULT_REGION:?S3_REGION is not configured}"
          : "${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is not configured}"

          mkdir -p src/contents
          aws s3 sync \
            s3://itsakaseru-web/contents/ \
            src/contents/ \
            --endpoint-url "${S3_ENDPOINT_URL}" \
            --delete \
            --no-progress

          if ! find src/contents -type f -print -quit | grep -q .; then
            echo "No content files were downloaded from S3." >&2
            exit 1
          fi

      - name: Build image with Railpack
        id: image
        run: |
          set -euo pipefail

          LOCAL_IMAGE="${REGISTRY_REPOSITORY}:${GITHUB_SHA}"
          PRODUCTION_IMAGE="${REGISTRY_HOST}/${REGISTRY_REPOSITORY}:latest"

          echo "Building image..."
          echo "Commit: ${GITHUB_SHA}"

          railpack build \
            --name "${LOCAL_IMAGE}" \
            --platform linux/amd64 \
            --progress plain \
            --env "SITE_URL=${SITE_URL}" \
            --env "RAILPACK_DEPLOY_APT_PACKAGES=${RAILPACK_DEPLOY_APT_PACKAGES}" \
            .

          docker image inspect "${LOCAL_IMAGE}" > /dev/null
          docker tag "${LOCAL_IMAGE}" "${PRODUCTION_IMAGE}"
          echo "production_image=${PRODUCTION_IMAGE}" >> "${GITHUB_OUTPUT}"

      - name: Push image to registry
        env:
          PRODUCTION_IMAGE: ${{ steps.image.outputs.production_image }}
        run: |
          set -euo pipefail

          docker push "${PRODUCTION_IMAGE}"

      - name: Deploy to Dokploy
        env:
          DOKPLOY_BASE_URL: ${{ secrets.DOKPLOY_BASE_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APPLICATION_ID: ${{ secrets.DOKPLOY_APPLICATION_ID }}
        run: |
          set -euo pipefail

          DEPLOY_MARKER="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          COMMIT_MESSAGE="$(git log -1 --pretty=%s "${GITHUB_SHA}")"

          echo "Triggering Dokploy deployment..."

          payload=$(jq -n \
            --arg applicationId "${DOKPLOY_APPLICATION_ID}" \
            --arg title "${COMMIT_MESSAGE}" \
            --arg description "${DEPLOY_MARKER}" \
            '{
              applicationId: $applicationId,
              title: $title,
              description: $description
            }')

          response=$(curl -sS \
            -o /tmp/dokploy-response.txt \
            -w "%{http_code}" \
            -X POST "${DOKPLOY_BASE_URL}/api/application.deploy" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${DOKPLOY_API_KEY}" \
            -d "${payload}")

          echo "Deploy request HTTP status: ${response}"

          if [ "${response}" -lt 200 ] || [ "${response}" -ge 300 ]; then
            echo "Dokploy deploy request failed ❌"
            exit 1
          fi

          echo "Deployment queued."
          echo "Timeout: ${DOKPLOY_DEPLOY_TIMEOUT}s"
          echo "Polling interval: ${DOKPLOY_DEPLOY_POLL_INTERVAL}s"

          SECONDS=0

          while [ "${SECONDS}" -lt "${DOKPLOY_DEPLOY_TIMEOUT}" ]; do
            deployments=$(curl -fsS \
              -G "${DOKPLOY_BASE_URL}/api/deployment.all" \
              -H "x-api-key: ${DOKPLOY_API_KEY}" \
              --data-urlencode "applicationId=${DOKPLOY_APPLICATION_ID}")

            deployment=$(echo "${deployments}" | jq -c \
              --arg marker "${DEPLOY_MARKER}" \
              '[.[] | select(.description == $marker)][0] // empty')

            if [ -z "${deployment}" ]; then
              echo "Waiting for deployment record..."
              sleep "${DOKPLOY_DEPLOY_POLL_INTERVAL}"
              continue
            fi

            deployment_id=$(echo "${deployment}" | jq -r '.deploymentId')
            status=$(echo "${deployment}" | jq -r '.status')

            echo "Deployment ID: ${deployment_id}"
            echo "Deployment status: ${status}"

            case "${status}" in
              done)
                echo "Dokploy production deployment completed successfully ✅"
                exit 0
                ;;

              error)
                echo "Dokploy production deployment failed ❌"
                exit 1
                ;;

              *)
                sleep "${DOKPLOY_DEPLOY_POLL_INTERVAL}"
                ;;
            esac
          done

          echo "Dokploy production deployment timed out after ${DOKPLOY_DEPLOY_TIMEOUT}s ❌"
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f buildkit 2>/dev/null || true
          docker logout "${REGISTRY_HOST}" 2>/dev/null || true
